name: Deploy public game site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: public-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:public

  mobile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:mobile

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:public
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-public
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published pages
        shell: bash
        run: |
          set -euo pipefail
          base="https://lacinnik.github.io/Game-GDEYA/"
          for page in "" "labs/sc5-chronos/"; do
            ok=0
            for attempt in 1 2 3 4 5 6; do
              if curl --fail --location --silent --show-error --max-time 20 "${base}${page}" -o /tmp/gdeya-published.html; then
                if grep -qi '<html' /tmp/gdeya-published.html; then ok=1; break; fi
              fi
              sleep 10
            done
            if [ "$ok" != 1 ]; then echo "Unverified publication: ${base}${page}" >&2; exit 1; fi
            echo "Published page verified: ${base}${page}"
          done
